version: '3.8'

services:
  app:
    build: .
    environment:
      - AWS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/attachments
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
    volumes:
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      - ollama
      - localstack

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3