services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attachments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  worker:
    build: .
    depends_on:
      - postgres
      - ollama
    env_file:
      - .env

volumes:
  postgres-data:
  ollama-data:

